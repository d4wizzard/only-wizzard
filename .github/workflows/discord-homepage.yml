name: Discord – neuer Only-Wizzard-Content

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "assets/**"
      - "comments-video.js"
      - "more-content.js"
      - "more-content-2.js"
      - "all-images.js"
      - "recruitment.js"
      - "d4serve-gallery.js"
      - "collar-content.js"
      - "intimacy-content.js"
      - "fantasy-more.js"
      - "voice-casting.js"

permissions:
  contents: read

jobs:
  announce:
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_HOMEPAGE_WEBHOOK }}
    steps:
      - name: Kurzen Hinweis in Discord posten
        if: ${{ env.DISCORD_WEBHOOK != '' }}
        env:
          UPDATE_TITLE: ${{ github.event.head_commit.message }}
          SITE_URL: https://d4wizzard.github.io/only-wizzard/
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess

          title = (os.environ.get("UPDATE_TITLE") or "Die automatische Ankündigung ist eingerichtet.").splitlines()[0].strip()
          if len(title) > 140:
              title = title[:137] + "..."

          payload = {
              "thread_name": f"Only Wizzard · {title}"[:100],
              "content": (
                  "✨ **Neuer Inhalt bei Only Wizzard**\n"
                  f"{title}\n"
                  f"🔗 {os.environ['SITE_URL']}"
              ),
              "allowed_mentions": {"parse": []},
          }

          subprocess.run(
              [
                  "curl", "--fail", "--silent", "--show-error",
                  "--header", "Content-Type: application/json",
                  "--header", "User-Agent: DiscordBot (Only-Wizzard-Notifier, 1.0)",
                  "--data", json.dumps(payload),
                  os.environ["DISCORD_WEBHOOK"],
              ],
              check=True,
          )
          PY
